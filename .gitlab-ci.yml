image: docker

services:
  - docker:stable-dind

stages:
  - build
  - test

before_script:
  - docker version
  - apk add --no-cache docker-compose
  - docker-compose version
  - docker login -u gitlab-ci-token -p $REGISTRY_TOKEN $REGISTRY

after_script:
  - docker-compose -f docker-compose.ci.yml down
  - docker-compose -f docker-compose.ci.yml ps


build:
  stage: build
  script:
    - echo "Building ..."
    - docker-compose -f docker-compose.ci.yml build
    - docker-compose -f docker-compose.ci.yml push

test_authentication:
  stage: test
  needs:
    - build
  script:
    - echo "Testing ..."
    - docker-compose -f docker-compose.ci.yml pull
    - docker-compose -f docker-compose.ci.yml run web sh -c "pipenv run python solar/manage.py makemigrations && pipenv run python solar/manage.py migrate && pipenv run python solar/manage.py test authentication -v 2"