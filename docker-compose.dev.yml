version: '3'

services:
  django_wsgi:
    container_name: django_wsgi
    build: ./solar
    command: sh -c "pipenv run python manage.py collectstatic --noinput && pipenv run uwsgi --socket=:9000 --module=solar.wsgi:application --py-autoreload=1"
    volumes:
      - ./solar:/code
    networks:
      - webnet

  nginx:
    container_name: django_nginx
    image: nginx:latest
    depends_on:
      - django_wsgi
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - ./solar/static/:/code/static
      - ./solar/media/:/code/media
    networks:
      - webnet
    ports:
      - "80:80"

networks:
  webnet:
