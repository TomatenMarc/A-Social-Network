version: '3'

services:
  # notice: this needs an valid certbot directory with an dummy certificate (chicken and egg problem)
  certbot:
    image: certbot/certbot:latest
    command: certonly --webroot --webroot-path=/var/www/certbot --email marc.feger@uni-duesseldorf.de --agree-tos --no-eff-email -d solar.marc-feger.de --keep-until-expiring
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/logs:/var/log/letsencrypt
      - ./certbot/data:/var/www/certbot

  solar:
    container_name: solar
    build: ./solar
    restart: always
    command: sh -c "pipenv run python manage.py collectstatic --noinput && pipenv run uwsgi --socket=:9000 --module=solar.wsgi:application --py-autoreload=1"
    volumes:
      - ./solar:/code
    networks:
      - webnet

  nginx:
    container_name: nginx
    image: nginx:latest
    restart: always
    depends_on:
      - solar
      - certbot
    volumes:
      - ./nginx/production/:/etc/nginx/conf.d
      - ./solar/django_static/:/code/django_static
      - ./solar/media/:/code/media
      - ./fairing/build:/var/www/fairing
      - ./certbot/conf:/etc/nginx/ssl
      - ./certbot/data:/var/www/certbot
    networks:
      - webnet
    ports:
      - "80:80"
      - "443:443"

networks:
  webnet:
